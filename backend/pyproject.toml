[project]
name = "backend"
version = "0.1.0"
description = "BackEnd-ListaTelefonica"
authors = [
    {name = "Ricardo",email = "ricardofrodrigues.contato@gmail.com.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi[standard] (>=0.139.2,<0.140.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.15.22,<0.16.0)",
    "typos (>=1.48.0,<2.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]



[tool.ruff]
line-length = 79
extend-exclude = ['migrations', '*.md']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
ignore = [
    "ERA001", # found-commented-out-code (Evita que o Ruff ache que português é código quebrado)
]

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest]
pythonpath = ['.']
addopts = ['-p', 'no:warnings', '--cov=lista_backend', '--cov-context=test']

[tool.taskipy.tasks]
pre_lint = 'typos'
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev app/main.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=lista_backend -vv'
post_test = 'coverage html --show-contexts'