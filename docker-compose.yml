services:
  backend:
    build: ./backend
    container_name: lista_backend_api
    ports:
      - "8085:8085"
    volumes:
      - ./backend:/app
      - /app/venv # Ignora o venv local para não chocar com o do container
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./lista.db
      - RUN_SEEDS=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8085').getcode()==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build: ./frontend
    container_name: lista_frontend_pwa
    ports:
      - "8086:8086"
    volumes:
      - ./frontend:/app
      - /app/.next
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8085
    depends_on:
      - backend
    restart: unless-stopped
      